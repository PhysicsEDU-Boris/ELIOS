name: elio
description: "ELIO - Smart Waste Sorting Robot Controller App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  google_sign_in: ^6.2.1

  # UI & State
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  web_socket_channel: ^2.4.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  flutter_native_splash: ^2.3.2
  flutter_riverpod: ^2.4.0
  flutter_dotenv: ^5.2.1
  flutter_3d_controller: ^2.3.0
  youtube_player_flutter: ^10.0.1
  syncfusion_flutter_pdfviewer: ^33.2.12

  # Vision & Camera
  tflite_flutter: 0.12.1
  image: ^4.0.0
  camera: 0.12.0+1

  # Smart Provisioning (Added for Project ELIO Phase 1)
  qr_flutter: ^4.1.0
  network_info_plus: ^6.1.0
  connectivity_plus: ^6.0.4
  open_settings_plus: ^0.5.0
  udp: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_auth_mocks: ^0.15.1
  fake_cloud_firestore: ^4.1.0+1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - .env.example
    - assets/guides/
    - assets/images/
    - assets/images/guides/
    - assets/images/quiz/
    - assets/images/thumbnails/
    - assets/icon/
    - assets/models/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/ELIO_ICON.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1D9E75"
  adaptive_icon_foreground: "assets/icon/ELIO_ICON.png"

flutter_native_splash:
  color: "#1D9E75"
  image: "assets/icon/ELIO_ICON.png"
  android_12:
    color: "#1D9E75"
    image: "assets/icon/ELIO_ICON.png"
    branding_mode: "contain"
  ios: true
  web: false
